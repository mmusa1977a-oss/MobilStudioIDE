name: Android CI (APK Derleyici)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repodaki kodları sunucuya çek
    - name: Kodları Çek
      uses: actions/checkout@v4

    # 2. Java 17 ortamını kur (v4 sürümüne güncellendi)
    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Gradle (Derleme motoru) için çalışma izni ver
    - name: Gradle'a İzin Ver
      run: chmod +x gradlew

    # 4. Uygulamayı APK olarak derle
    - name: Debug APK Derle
      run: ./gradlew assembleDebug

    # 5. Çıkan APK dosyasını yükle (Hatanın çözüldüğü yer - v4'e güncellendi)
    - name: APK'yı Yükle
      uses: actions/upload-artifact@v4
      with:
        name: MobilStudio-APK
        path: app/build/outputs/apk/debug/app-debug.apk
