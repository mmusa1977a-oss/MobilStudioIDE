name: Android CI (APK Derleyici)

on:
  push:
    branches: [ "main" ] # Main dalına her kod yüklendiğinde çalışır
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # GitHub'ın bulut sunucusu

    steps:
    # 1. Repodaki kodları sunucuya çek (En güncel v4 sürümü)
    - name: Kodları Çek
      uses: actions/checkout@v4

    # 2. Java 17 ortamını kur (v3'ten v4'e güncellendi)
    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Uygulamayı APK olarak derle (gradlew HATA VERDİĞİ İÇİN direkt gradle komutu kullanıldı)
    - name: Debug APK Derle
      run: gradle assembleDebug

    # 4. Çıkan APK dosyasını GitHub sayfasına indirme linki olarak koy (v3'ten v4'e güncellendi)
    - name: APK'yı Yükle
      uses: actions/upload-artifact@v4
      with:
        name: MobilStudio-APK
        path: app/build/outputs/apk/debug/app-debug.apk
